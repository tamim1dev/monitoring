name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: node --version && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate artifact
        run: tar -czf hello-express-${{ github.run_number }}.tgz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-express-build
          path: app/hello-express-${{ github.run_number }}.tgz
          if-no-files-found: error
